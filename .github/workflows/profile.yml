name: Update profile images

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats card
        run: python scripts/profile_stats.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f4a7c4&color_dots=#ebedf0,#c9d4ee,#8ea3d4,#5d73a2,#3d4f78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f4a7c4&color_dots=#1b2026,#2c3a5a,#3d4f78,#5d73a2,#8ea3d4
            
      - name: Certificates slideshow
      run: |
        pip install pymupdf pillow
        python scripts/cert_slides.py --out dist
        
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
